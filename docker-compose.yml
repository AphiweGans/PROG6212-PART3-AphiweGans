
services:
  raceday-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-RaceDay_Docker_2026!ChangeMe}
    ports:
      - "14333:1433"
    volumes:
      - raceday-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [raceday-network]

  raceday-api:
    build:
      context: .
      dockerfile: RaceDay.API/Dockerfile
    container_name: raceday-api
    ports: ["8081:8081"]
    volumes:
      - raceday-api-keys:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RunMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Server=raceday-db,1433;Database=RaceDayDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-RaceDay_Docker_2026!ChangeMe};TrustServerCertificate=True;Encrypt=False;"
      MvcAppUrl: "http://localhost:8080"
      AzureBlobStorage__ConnectionString: ${AZURE_BLOB_CONNECTION_STRING:-}
      AzureBlobStorage__ContainerName: "event-images"
    depends_on:
      raceday-db:
        condition: service_healthy
    networks: [raceday-network]

  raceday-web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    container_name: raceday-web
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiSettings__BaseUrl: "http://raceday-api:8081/"
    depends_on: [raceday-api]
    networks: [raceday-network]

volumes:
  raceday-sql-data:
  raceday-api-keys:

networks:
  raceday-network:
    driver: bridge
